name: Deploy game with Terraform

on:
  push:
    branches: [ main ]
  # optional: let you click "Run workflow" in the Actions tab
  workflow_dispatch:

jobs:
  terraform_deploy:
    runs-on: ubuntu-latest

    env:
      # AWS credentials for the Terraform AWS provider
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

      # This becomes Terraform variable "container_image"
      TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE }}

    # All Terraform commands run from the infra/ directory
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false

      - name: Terraform apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false
